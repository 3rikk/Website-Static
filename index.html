<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="color-scheme" content="light dark">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<meta name="description" content="">
		<link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16.png">
		<link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
		<link rel="manifest" href="site.webmanifest">
		<title></title>
		<link rel="stylesheet" href="style.css">

	<body data-page="home">
		<div class="page cv-home">
			<section class="intro" aria-labelledby="intro-title">
				<div class="intro-content">
					<div class="intro-identity">
						<img class="intro-portrait" alt="">
						<p class="eyebrow" id="intro-eyebrow"></p>
						<h1 id="intro-title"></h1>
					</div>
					<div class="intro-actions">
						<p class="lead" id="intro-description"></p>
						<p class="lead" id="intro-contact"></p>
					</div>
				</div>
				<a class="scroll-prompt" href="#cv"><span></span><i aria-hidden="true"></i></a>
			</section>
			<main id="cv" class="cv-section" aria-labelledby="cv-title">
				<header class="cv-heading"><h2 id="cv-title"><span id="cv-title-text"></span><br><em id="cv-title-emphasis"></em></h2><p id="cv-description"></p></header>
				<div class="timeline-key" id="timeline-key" role="group"></div>
				<div class="timeline-filters" id="timeline-filters" role="group"></div>
				<p class="traditional-cv-note" id="traditional-cv-note"></p><br>
				<div id="timeline" class="timeline mobile-work-active"></div>
			</main>
		</div>
		<script src="site-content.js" defer></script><script src="site.js" defer></script><script src="menu.js" defer></script><script src="footer.js" defer></script><script src="consent.js" defer></script><script src="cv-entries.js" defer></script><script src="cv-data.js" defer></script>
	</body>
